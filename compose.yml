name: webdav

services:
  app:
    container_name: webdav
    image: 'webdav:test'
    ports:
     - '6065:6065'
    security_opt:
      - label=type:container_runtime_t
    restart: always
    volumes:
      - ./data:/data
      - ./config.yml:/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:6065/__webdav__/health"]
